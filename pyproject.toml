[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow-ci-demo"
version = "0.1.0"
description = "A small task manager for learning GitHub CI/CD"
requires-python = ">=3.10"

[project.scripts]
taskflow = "taskflow.cli:main"

[tool.setuptools.packages.find]
include = ["taskflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
